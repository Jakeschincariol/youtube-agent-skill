<!doctype html>
<html
  lang="ar"
  dir="rtl"
  data-composition-variables='[
    {"id":"credit","type":"string","label":"Media credit","default":"Creator or archive"},
    {"id":"detail","type":"string","label":"License or source detail","default":"License or archive record"},
    {"id":"direction","type":"string","label":"Text direction","default":"rtl"},
    {"id":"textColor","type":"color","label":"Text color","default":"#f1f3f1"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      @keyframes doc-credit-enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #credit-line {
        position: absolute;
        right: 5.2%;
        bottom: 4.1%;
        display: flex;
        max-width: 70%;
        align-items: baseline;
        gap: 7px;
        color: #f1f3f1;
        font-size: clamp(20px, 1.46vw, 28px);
        line-height: 1.35;
        text-align: start;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 2px 8px rgba(0, 0, 0, 0.8);
        animation: doc-credit-enter 0.35s ease-out 0.1s both;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="doc-source-credit"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
      data-no-timeline
    >
      <div
        id="credit-line"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-hold
      >
        <span id="credit-text"></span>
      </div>
    </div>
    <script>
      (function () {
        var variables = window.__hyperframes.getVariables();
        var root = document.getElementById("root");
        var line = document.getElementById("credit-line");
        root.dir = variables.direction === "ltr" ? "ltr" : "rtl";
        line.dir = root.dir;
        line.style.color = variables.textColor;
        document.getElementById("credit-text").textContent = variables.detail
          ? variables.credit + " · " + variables.detail
          : variables.credit;
      })();
    </script>
  </body>
</html>
